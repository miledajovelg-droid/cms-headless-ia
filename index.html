<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CMS Headless IA</title>
</head>
<body>

  <h1>Proyectos de IA - CMS Headless</h1>

  <div id="posts"></div>

  <script>
    const posts = [
      {
        title: "Chatbots con IA",
        excerpt: "Desarrollo de asistentes virtuales para atención al cliente."
      },
      {
        title: "Proyecto de IA para Educación",
        excerpt: "Sistema inteligente para personalizar el aprendizaje de estudiantes universitarios."
      },
      {
        title: "IA aplicada a Salud",
        excerpt: "Uso de inteligencia artificial para diagnóstico médico automatizado."
      }
    ];

    const contenedor = document.getElementById("posts");

    posts.forEach(post => {
      contenedor.innerHTML += `
        <div style="border:1px solid #ccc; padding:15px; margin:15px 0;">
          <h2>${post.title}</h2>
          <p>${post.excerpt}</p>
        </div>
      `;
    });
  </script>

</body>
</html>
