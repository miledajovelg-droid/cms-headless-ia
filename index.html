<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CMS Headless IA</title>
</head>
<body>

  <h1>Proyectos de IA - CMS Headless</h1>
  <div id="posts"></div>

  <script>
    fetch('https://campusmj.great-site.net/wordpress/wp-json/wp/v2/posts')
      .then(response => response.json())
      .then(data => {
        const contenedor = document.getElementById('posts');

        data.forEach(post => {
          contenedor.innerHTML += `
            <div>
              <h2>${post.title.rendered}</h2>
              <div>${post.excerpt.rendered}</div>
            </div>
          `;
        });
      })
      .catch(error => console.log(error));
  </script>

</body>
</html>
